<!DOCTYPE html> <!-- Declara o tipo de documento como HTML5 -->
<html lang="pt-BR"> <!-- Define a linguagem da página como português brasileiro -->

<head>
    <meta charset="UTF-8"> <!-- Especifica a codificação de caracteres como UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Define a largura da janela de visualização e a escala inicial para dispositivos móveis -->
    <link rel="stylesheet" href="styles.css"> <!-- Importa o arquivo de estilo CSS externo (agora com "s") -->
</head>

<body>

    <div class="container"> <!-- Cria um contêiner para todo o conteúdo da página -->

        <h1>Minhas Tarefas</h1> <!-- Título principal da página -->

        <div class="input-container"> <!-- Cria um contêiner para o campo de entrada de texto e o botão -->

            <input type="text" id="taskInput" placeholder="Digite sua tarefa">
            <!-- Campo de entrada de texto para as tarefas -->

            <button id="addTaskBtn">Adicionar Tarefa</button>
            <!-- Botão para adicionar tarefa -->
            
        </div>

        <ul id="taskList"> <!-- Lista não ordenada onde as tarefas serão exibidas -->

            <!-- Tarefas serão adicionadas aqui -->

        </ul>

    </div>

    <script src="script.js"></script> <!-- Importa o arquivo de script JavaScript externo -->

</body>

</html>
